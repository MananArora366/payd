spec_version: "2.0"
component: "zero-loss-ledger"
framework: "AWS Kiro Spec-Driven Architecture"
invariants:
  - id: INV-01
    name: "Integer Minor Units (Fils)"
    rule: "All financial balances, shares, and settlements MUST be stored as signed 64-bit integer minor units (fils: 1 AED = 100 fils). Floating point values are strictly forbidden."
  - id: INV-02
    name: "Zero-Loss Conservation of Money"
    rule: "The sum of all splits in any transaction MUST exactly equal total amount_minor: sum(splits) == total_minor. Any fractional fils are allocated deterministically to the first members."
  - id: INV-03
    name: "Zero-Sum Net Balances"
    rule: "Within any closed group ledger, sum(net_balances) == 0 at all times."
  - id: INV-04
    name: "Optimal Min-Cash-Flow Debt Simplification"
    rule: "Greedy graph algorithm collapses N-person circular debts into at most N-1 transactions, eliminating an average of 62% of redundant transfers."
test_coverage:
  suites: 5
  total_tests: 42
  status: "100% PASSING"
